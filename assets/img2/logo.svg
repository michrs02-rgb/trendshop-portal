<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Filtros de Glow Neon -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glowMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <radialGradient id="bgDarkGradient" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#24104a" />
      <stop offset="70%" stop-color="#14092A" />
      <stop offset="100%" stop-color="#0b0417" />
    </radialGradient>
  </defs>

  <!-- Fundo Circular Roxo Noturno -->
  <circle cx="50" cy="50" r="46" fill="url(#bgDarkGradient)" />

  <!-- Anel Externo Neon Magenta -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#FF2A85" stroke-width="2.2" opacity="0.85" filter="url(#glowMagenta)" stroke-dasharray="160 30" />

  <!-- Anel Interno Neon Ciano -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9" filter="url(#glowCyan)" stroke-dasharray="140 40" stroke-dashoffset="60" />

  <!-- Ícone Estilizado de Sacola de Compras / Carrinho Neon com Iniciais TS -->
  <g transform="translate(23, 21)">
    <!-- Alça da Sacola Superior -->
    <path d="M18 16 C18 7, 36 7, 36 16" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" filter="url(#glowCyan)" />
    
    <!-- Corpo da Sacola Futurista -->
    <path d="M11 16 L43 16 L40 46 C39.5 49, 37.5 51, 34 51 L20 51 C16.5 51, 14.5 49, 14 46 Z" fill="rgba(255, 42, 133, 0.12)" stroke="#FF2A85" stroke-width="2.5" stroke-linejoin="round" filter="url(#glowMagenta)" />

    <!-- Iniciais "TS" Integradas no Centro -->
    <text x="27" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      <tspan fill="#00E5FF">T</tspan><tspan fill="#FF2A85">S</tspan>
    </text>

    <!-- Ponto de Brilho Estrela -->
    <circle cx="41" cy="18" r="2.2" fill="#00E5FF" filter="url(#glowCyan)" />
  </g>
</svg>
